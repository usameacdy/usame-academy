version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eduflow_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eduflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: eduflow_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/eduflow
      JWT_SECRET: your_super_secret_jwt_key
      PORT: 5000
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: eduflow_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
